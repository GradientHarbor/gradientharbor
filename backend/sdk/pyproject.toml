[project]
name = "gradientharbor"
version = "0.1.0"
description = "One-line trace capture for agents: gradientharbor.wrap(client, task=...)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gradientharbor"]
