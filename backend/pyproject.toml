[project]
name = "harbor-backend"
version = "0.1.0"
description = "GradientHarbor collector: traces, privacy ledger, teacher proxy, dataset builder, model registry, eval results"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "anthropic>=1.0",
  "pydantic>=2.9",
  "gradientharbor",
]

[tool.uv.sources]
gradientharbor = { path = "sdk", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
