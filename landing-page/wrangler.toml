name = "gradientharbor-landing"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Root of the domain. gradientharbor.com/bi* is routed to the "gradientharbor" Worker
# (old BI site); Cloudflare picks the more specific route, so /bi keeps working.
routes = [
  { pattern = "gradientharbor.com/*", zone_name = "gradientharbor.com" },
  { pattern = "www.gradientharbor.com/*", zone_name = "gradientharbor.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
