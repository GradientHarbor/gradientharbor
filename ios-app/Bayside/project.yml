# XcodeGen spec: `xcodegen generate` in this folder creates Bayside.xcodeproj.
name: Bayside
options:
  bundleIdPrefix: com.gradientharbor
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HarborKit:
    path: ../HarborKit
targets:
  Bayside:
    type: application
    platform: iOS
    sources:
      - path: Bayside
    dependencies:
      - package: HarborKit
        product: HarborCore
      - package: HarborKit
        product: HarborMLX
    entitlements:
      path: Bayside/Bayside.entitlements
      properties:
        # The 5.5 GB student needs more than the default app memory limit.
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Bayside/Info.plist
      properties:
        CFBundleDisplayName: Bayside
        # Side-load the model into Documents/Models via Finder / Files / devicectl.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gradientharbor.bayside
            CFBundleURLSchemes: [bayside]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The Simulator reaches the device runtime and backend on the Mac over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Bayside connects to the GradientHarbor runtime and backend on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradientharbor.bayside
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QNV5826RKW
        ENABLE_PREVIEWS: YES

  # A second copy of the app for the Liquid LFM3-1.7B student, installed side by side with the Gemma app
  # (own bundle id, display name, URL scheme and Documents/Models). Same sources: the model folder's
  # config.json picks the architecture and chat template.
  BaysideLFM3:
    type: application
    platform: iOS
    sources:
      - path: Bayside
        excludes: [Info.plist, Bayside.entitlements]
    dependencies:
      - package: HarborKit
        product: HarborCore
      - package: HarborKit
        product: HarborMLX
    entitlements:
      path: BaysideLFM3/BaysideLFM3.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: BaysideLFM3/Info.plist
      properties:
        CFBundleDisplayName: Bayside LFM3
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gradientharbor.bayside.lfm3
            CFBundleURLSchemes: [bayside-lfm3]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Bayside connects to the GradientHarbor runtime and backend on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradientharbor.bayside.lfm3
        PRODUCT_NAME: BaysideLFM3
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QNV5826RKW
        ENABLE_PREVIEWS: YES
